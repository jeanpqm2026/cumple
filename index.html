<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Feliz cumpleaños, Ana Lucía!</title>
<style>
:root{--bg:#1d1442;--bg2:#3a1f6b;--ink:#fff7e6;--pink:#ff5d8f;--gold:#ffc83d;--teal:#2ee6c5;--cake:#ffd9a8;--choc:#6b3a2a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 100%,var(--bg2),var(--bg) 70%);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
canvas{position:fixed;inset:0;pointer-events:none}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.2rem,8vw,4.5rem);line-height:1.1;position:relative;z-index:2}
h1 span{display:inline-block;animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
p{margin-top:10px;font-size:clamp(1rem,3.5vw,1.3rem);position:relative;z-index:2;opacity:.9}
.cake{position:relative;z-index:2;margin-top:28px;width:220px}
.layer{height:50px;border-radius:12px 12px 6px 6px;margin:0 auto;position:relative}
.l1{width:220px;background:var(--pink)}
.l2{width:160px;background:var(--cake);margin-bottom:-4px}
.l3{width:100px;background:var(--teal);height:40px}
.l1::before,.l2::before,.l3::before{content:"";position:absolute;inset:0 0 auto 0;height:14px;background:#fff;border-radius:12px 12px 20px 20px;opacity:.9}
.candles{display:flex;justify-content:center;gap:16px;margin-bottom:-2px}
.candle{width:10px;height:34px;background:linear-gradient(var(--gold),#fff);border-radius:3px;position:relative}
.flame{position:absolute;left:50%;top:-18px;width:12px;height:18px;margin-left:-6px;background:radial-gradient(#fff 15%,#ffb300 60%,transparent 70%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:flick .3s infinite alternate;transition:opacity .3s}
.out .flame{opacity:0}
@keyframes flick{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.15,.9) rotate(4deg)}}
.plate{width:260px;height:12px;background:var(--choc);border-radius:8px;margin:0 auto}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;position:relative;z-index:2}
button{margin-top:26px;font:inherit;font-weight:700;padding:12px 26px;border:0;border-radius:999px;background:var(--gold);color:#3a1f00;cursor:pointer;transition:transform .15s}
button.alt{background:var(--teal)}
button:hover{transform:scale(1.06)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.balloon{position:fixed;bottom:-120px;width:56px;height:70px;border-radius:50% 50% 48% 48%;animation:rise linear forwards;z-index:1}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:50px;background:rgba(255,255,255,.5)}
@keyframes rise{to{transform:translateY(-130vh) translateX(var(--dx))}}
@media(prefers-reduced-motion:reduce){h1 span,.flame{animation:none}.balloon{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<h1 id="t" aria-label="¡Feliz cumpleaños, Ana Lucía!"></h1>
<p id="name"><strong>Lic. Ana Lucía Velazquez Parra</strong><br>Licenciada en Psicología</p>
<p>Gracias por escuchar, comprender y acompañar a tantas personas.<br>Que este nuevo año te cuide a ti con el mismo cariño. 🧠💛</p>

<div class="cake" id="cake">
  <div class="candles"><div class="candle"><i class="flame"></i></div><div class="candle"><i class="flame"></i></div><div class="candle"><i class="flame"></i></div></div>
  <div class="layer l3"></div><div class="layer l2"></div><div class="layer l1"></div>
  <div class="plate"></div>
</div>
<div class="row">
  <button id="btn">Soplar las velas</button>
  <button id="music" class="alt">🎵 Música</button>
</div>

<script>
const texto = "¡Feliz cumpleaños, Ana Lucía!";
const h = document.getElementById("t");
[...texto].forEach((ch,i)=>{const s=document.createElement("span");s.textContent=ch===" "?"\u00A0":ch;s.style.animationDelay=(i*0.07)+"s";s.setAttribute("aria-hidden","true");h.appendChild(s)});

const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W,H;function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener("resize",size);
const cols=["#ff5d8f","#ffc83d","#2ee6c5","#7aa2ff","#fff7e6"];
let parts=[];
function burst(x,y,n=90){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=3+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,g:.18,r:3+Math.random()*4,c:cols[Math.random()*cols.length|0],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:140})}}
function rain(){parts.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*1.5,vy:2+Math.random()*3,g:.01,r:3+Math.random()*4,c:cols[Math.random()*cols.length|0],rot:0,vr:.15,life:400})}
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function loop(){ctx.clearRect(0,0,W,H);if(!reduce&&Math.random()<.35)rain();
parts=parts.filter(p=>p.life-->0&&p.y<H+20);
for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()}
requestAnimationFrame(loop)}
loop();

function balloons(n){if(reduce)return;for(let i=0;i<n;i++){const b=document.createElement("div");b.className="balloon";b.style.left=Math.random()*95+"%";b.style.background=cols[Math.random()*4|0];b.style.setProperty("--dx",(Math.random()*120-60)+"px");b.style.animationDuration=(6+Math.random()*5)+"s";b.style.animationDelay=Math.random()*2+"s";document.body.appendChild(b);setTimeout(()=>b.remove(),13000)}}

/* ---------- Música: Cumpleaños feliz (generada con Web Audio) ---------- */
const song=[
 [392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],
 [392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
 [392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,1],
 [698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]
];
const beat=.55;
let ac=null,playing=false,timer=null;
const musicBtn=document.getElementById("music");
function note(f,t,d){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type="triangle";o.frequency.value=f;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.2,t+.03);
  g.gain.exponentialRampToValueAtTime(.001,t+d*.95);
  o.connect(g);g.connect(ac.destination);
  o.start(t);o.stop(t+d);
}
function playSong(){
  if(!playing||!ac)return;
  let t=ac.currentTime+.1;
  for(const [f,d] of song){note(f,t,d*beat);t+=d*beat}
  timer=setTimeout(playSong,(t-ac.currentTime)*1000+900);
}
function startMusic(){
  if(playing)return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  playing=true;playSong();
  musicBtn.textContent="🔇 Quitar música";
}
function stopMusic(){
  playing=false;clearTimeout(timer);
  if(ac){ac.close();ac=null}
  musicBtn.textContent="🎵 Música";
}
musicBtn.onclick=()=>playing?stopMusic():startMusic();
let autoTried=false;

const cake=document.getElementById("cake"),btn=document.getElementById("btn");
setTimeout(()=>{burst(W/2,H*.35,140);balloons(14)},400);
btn.onclick=()=>{
  const out=cake.classList.toggle("out");
  if(out){btn.textContent="Encender de nuevo";burst(W/2,H*.4,160);burst(W*.2,H*.5,80);burst(W*.8,H*.5,80);balloons(10)}
  else btn.textContent="Soplar las velas";
};
addEventListener("pointerdown",e=>{
  if(e.target===musicBtn)return;
  if(!autoTried){autoTried=true;startMusic()}
  if(e.target!==btn)burst(e.clientX,e.clientY,60);
});
</script>
</body>
</html>
